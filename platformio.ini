; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
build_dir = .pioenvs
build_cache_dir = .cache
;default_envs = OTA_HMBoth_v4_2_3
default_envs = UART_HMBoth_v4_2_3
lib_dir = lib

[common]
lib_deps = 
	knolleary/PubSubClient @ ^2.8.0
	bblanchon/ArduinoJson @ 7.2.1
	milesburton/DallasTemperature @ ^3.11.0
	miq19/eModbus @ ^1.7.2
	pedroalbuquerque/ESP32WebServer@^1.0
	plerup/EspSoftwareSerial @ ^8.2.0
	OneWire
build_flags = 
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE  ;0-5
	-DCONFIG_LOG_VERSION_2=1
	-mtext-section-literals
	-mlongcalls
	-Iinclude
	-DUSE_ARDUINO
	-DUSE_ESP32
	-Wno-sign-compare
	-Wno-unused-but-set-variable
	-Wno-unused-variable
	-fno-exceptions
	-D NDEBUG
	-Wl,-Map,firmware.map
	-DSERIAL_BUFFER_SIZE=256
	-D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM32_SECHEAP_NOTSHARED
	-D MMU_SEC_HEAP=0x40108000
	-D MMU_SEC_HEAP_SIZE=0x4000
upload_flags = 

[env:UART_HMBoth_v4_2_3]
build_type = release
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32doit-devkit-v1
board_build.partitions = partitions.csv
framework = arduino
build_unflags = -Wall
monitor_filters =
	;esp32_exception_decoder
	;log2file
monitor_speed = 115200
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_resetmethod = ${usb_defaults.upload_resetmethod}
upload_speed = ${usb_defaults.upload_speed}
upload_protocol = ${usb_defaults.upload_protocol}
upload_port = ${usb_defaults.upload_port}
extra_scripts = ${scripts_defaults.extra_scripts}
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags = 
	${common.build_flags}
lib_deps = 
	${common.lib_deps}
	adafruit/Adafruit NeoPixel@^1.15.5

[env:OTA_HMBoth_v4_2_3]
build_type = debug
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32doit-devkit-v1
board_build.mcu = esp32
board_build.partitions = partitions.csv
framework = arduino
build_unflags = -Wall
monitor_filters = 
	;esp32_exception_decoder
	;log2file
monitor_port = COM6
monitor_speed = 115200
debug_tool = esp-prog
debug_init_break = tbreak setup
check_tool = clangtidy
check_flags = clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_protocol = ${ota_defaults.upload_protocol}
upload_flags = ${ota_defaults.upload_flags}
upload_port = ${ota_defaults.upload_port}
extra_scripts = ${scripts_defaults.extra_scripts}
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags = 
	${common.build_flags}
lib_deps = 
	${common.lib_deps}
	adafruit/Adafruit NeoPixel@^1.15.5

[scripts_defaults]
extra_scripts = 
	post:piotools/name-firmware.py
	post:piotools/md5-generator.py
	piotools/littlefsbuilder.py

[usb_defaults]
upload_resetmethod = nodemcu
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 9600
upload_port = COM6

[ota_defaults]
upload_port = 192.168.0.70
upload_flags = 
	--auth=heisha
	--host_port=8266
;	--host_ip=192.168.0.189
	--timeout=30
upload_protocol = espota
